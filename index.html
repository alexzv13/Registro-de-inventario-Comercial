<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14120F">
<title>Registro de equipos — COSAC</title>
<link rel="icon" type="image/png" sizes="64x64" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
  :root{
    --bg:#14120F; --surface:#1C1A16; --plate:#211E19;
    --line:rgba(240,236,228,0.14); --fg:#F0ECE4; --muted:#A39C8E; --accent:#FBB813;
    --logo-ink:#F4F1EA; --logo-ink2:rgba(244,241,234,0.62);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="light"]{
    --bg:#F4F1E9; --surface:#FFFFFF; --plate:#F4F1E9;
    --line:rgba(20,18,15,0.16); --fg:#1A1815; --muted:#5C564B; --accent:#053D84;
    --logo-ink:#053D84; --logo-ink2:#646464;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{
    margin:0; padding:28px 0 44px;
    background:var(--bg); color:var(--fg);
    font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{width:100%; max-width:960px; margin:0 auto; padding:0 20px}
  .top{display:flex; align-items:center; gap:10px}
  .logo-link{display:block; line-height:0; border-radius:2px}
  .logo-link:focus-visible{outline:2px solid var(--accent); outline-offset:4px}
  .logo{display:block; width:155px; height:34px}
  .logo-ink{fill:var(--logo-ink)}
  .logo-ink2{fill:var(--logo-ink2)}
  .theme-btn{
    margin-left:auto; display:flex; align-items:center; justify-content:center;
    width:44px; height:44px; flex-shrink:0;
    background:transparent; border:1px solid var(--line); border-radius:3px;
    color:var(--muted); cursor:pointer;
  }
  .theme-btn:hover,.theme-btn:focus-visible{color:var(--accent); border-color:var(--accent)}
  .rule{height:1px; background:var(--line); margin:20px 0 22px}
  .eyebrow{margin:0 0 10px; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--accent)}
  h1{margin:0 0 8px; font-size:28px; line-height:1.15; font-weight:700; letter-spacing:-.01em}
  .sub{margin:0 0 26px; font-size:15px; line-height:1.5; max-width:52ch; color:var(--muted)}
  .back{
    display:inline-flex; align-items:center; gap:8px;
    margin:0 0 18px; padding:10px 14px 10px 10px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); text-decoration:none;
    border:1px solid var(--line); border-radius:3px; background:transparent; cursor:pointer;
  }
  .back:hover,.back:focus-visible{color:var(--accent); border-color:var(--accent)}
  .list{display:grid; gap:10px; grid-template-columns:1fr; list-style:none; margin:0; padding:0}
  .kit{
    display:flex; align-items:center; gap:14px; padding:14px;
    text-decoration:none; color:inherit;
    border:1px solid var(--line); border-radius:3px; background:var(--surface);
    transition:border-color .15s ease, transform .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .kit:hover,.kit:focus-visible{border-color:var(--accent); transform:translateY(-1px)}
  .kit:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .kit:hover .chev,.kit:focus-visible .chev{color:var(--accent)}
  .kit:active{border-color:var(--accent); transform:scale(.99)}
  .kit.is-opening{border-color:var(--accent)}
  .kit.is-opening .meta,.kit.is-opening .chev{color:var(--accent)}
  .kit.is-opening .chev{animation:empuje .9s ease-in-out infinite}
  @keyframes empuje{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
  .plate{
    display:flex; align-items:center; justify-content:center;
    width:52px; height:52px; flex-shrink:0; overflow:hidden;
    border:1px solid var(--line); border-radius:2px; background:var(--plate);
  }
  .plate img{width:100%; height:100%; object-fit:contain; padding:6px; background:#FFFFFF; display:block}
  .num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-size:19px; font-weight:600; color:var(--accent)}
  .num.sm{font-size:15px}
  .body{flex-grow:1; min-width:0; display:flex; flex-direction:column; gap:3px}
  .name{font-size:16px; font-weight:600; line-height:1.25}
  .meta{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.05em; color:var(--muted)}
  .chip{display:inline-flex; align-items:center; gap:6px; align-self:flex-start; margin-top:2px; padding:2px 7px 2px 6px; border:1px solid var(--line); border-radius:2px}
  .chev{flex-shrink:0; display:flex; color:var(--muted)}
  .notes{margin-top:28px; padding-top:18px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px}
  .notes p{margin:0; font-size:13px; line-height:1.6; color:var(--muted)}
  @media (min-width:760px){
    .wrap{padding:0 40px}
    .logo{width:192px; height:42px}
    .list{grid-template-columns:1fr 1fr; gap:12px}
    .list > li:last-child:nth-child(odd){grid-column:1 / -1}
    h1{font-size:38px}
    .kit{padding:16px}
  }
  @media (prefers-reduced-motion:reduce){
    .kit,.kit:hover,.kit:active{transition:none; transform:none}
    .kit.is-opening .chev{animation:none}
  }
</style>
</head>

/* ===================== FIN DEL BLOQUE EDITABLE ========================== */

(function () {
  var vista = document.getElementById('vista');

  function svgChev() {
    return '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">' +
      '<path d="M6.5 3.5L12 9L6.5 14.5" stroke="currentColor" stroke-width="1.6" ' +
      'stroke-linecap="round" stroke-linejoin="round"></path></svg>';
  }

  function svgLista() {
    return '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">' +
      '<path d="M2 3h8M2 6h8M2 9h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg>';
  }

  function crearPlaca(texto, imagen) {
    var plate = document.createElement('span');
    plate.className = 'plate';
    function ponerTexto() {
      plate.innerHTML = '';
      var n = document.createElement('span');
      n.className = texto.length > 2 ? 'num sm' : 'num';
      n.textContent = texto;
      plate.appendChild(n);
    }
    if (imagen) {
      var im = document.createElement('img');
      im.src = 'img/' + imagen;
      im.alt = '';
      im.onerror = ponerTexto;
      plate.appendChild(im);
    } else {
      ponerTexto();
    }
    return plate;
  }

  function crearFila(opts) {
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.className = 'kit';
    a.href = opts.href;
    a.setAttribute('data-meta', opts.meta);

    var body = document.createElement('div');
    body.className = 'body';
    var nm = document.createElement('span');
    nm.className = 'name';
    nm.textContent = opts.nombre;
    var mt = document.createElement('span');
    mt.className = opts.grupo ? 'meta chip' : 'meta';
    if (opts.grupo) { mt.innerHTML = svgLista(); }
    var tx = document.createElement('span');
    tx.className = 'meta-tx';
    tx.textContent = opts.meta;
    mt.appendChild(tx);
    body.appendChild(nm);
    body.appendChild(mt);

    var chev = document.createElement('span');
    chev.className = 'chev';
    chev.innerHTML = svgChev();

    a.appendChild(crearPlaca(opts.placa, opts.img));
    a.appendChild(body);
    a.appendChild(chev);
    li.appendChild(a);
    return li;
  }

  function cabecera(antetitulo, titulo, subtitulo) {
    var e = document.createElement('p');
    e.className = 'eyebrow';
    e.textContent = antetitulo;
    var h = document.createElement('h1');
    h.textContent = titulo;
    var p = document.createElement('p');
    p.className = 'sub';
    p.textContent = subtitulo;
    vista.appendChild(e);
    vista.appendChild(h);
    vista.appendChild(p);
  }

  function vistaPrincipal() {
    vista.innerHTML = '';
    cabecera(AREA, TITULO_PRINCIPAL, SUBTITULO_PRINCIPAL);
    var ul = document.createElement('ul');
    ul.className = 'list';

    KITS.forEach(function (k) {
      var agrupado = !!(k.equipos && k.equipos.length);
      ul.appendChild(crearFila({
        href: agrupado ? '#' + k.id : (k.url || '#'),
        placa: k.codigo,
        img: k.img,
        nombre: k.nombre,
        grupo: agrupado,
        meta: agrupado ? (k.equipos.length + ' equipos') : 'Registrar entrada / salida'
      }));
    });

    vista.appendChild(ul);
  }

  function vistaKit(k) {
    vista.innerHTML = '';

    var volver = document.createElement('a');
    volver.className = 'back';
    volver.href = '#';
    volver.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">' +
      '<path d="M8.5 2.5L4 7l4.5 4.5" stroke="currentColor" stroke-width="1.6" ' +
      'stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Todos los kits</span>';
    vista.appendChild(volver);

    cabecera('Kit ' + k.codigo, k.nombre, 'Elige el equipo y registra su entrada o salida.');

    var ul = document.createElement('ul');
    ul.className = 'list';
    k.equipos.forEach(function (e, i) {
      ul.appendChild(crearFila({
        href: e.url || '#',
        placa: k.codigo + '.' + (i + 1),
        img: e.img,
        nombre: e.nombre,
        meta: 'Registrar entrada / salida'
      }));
    });

    vista.appendChild(ul);
  }

  function pintar() {
    var id = (location.hash || '').replace('#', '');
    var kit = null;
    KITS.forEach(function (k) { if (k.id && k.id === id) { kit = k; } });
    if (kit) { vistaKit(kit); } else { vistaPrincipal(); }
    window.scrollTo(0, 0);
  }

  /* Al tocar un formulario: aviso visible mientras carga (con mala señal tarda) */
  function resetear() {
    var abiertos = vista.querySelectorAll('.kit.is-opening');
    for (var i = 0; i < abiertos.length; i++) {
      abiertos[i].classList.remove('is-opening');
      var t = abiertos[i].querySelector('.meta-tx');
      if (t) { t.textContent = abiertos[i].getAttribute('data-meta') || ''; }
    }
  }

  vista.addEventListener('click', function (ev) {
    if (ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) { return; }
    var a = ev.target.closest ? ev.target.closest('a.kit') : null;
    if (!a || !/^https?:/i.test(a.getAttribute('href') || '')) { return; }
    a.classList.add('is-opening');
    var t = a.querySelector('.meta-tx');
    if (t) { t.textContent = 'Abriendo formulario…'; }
    setTimeout(resetear, 12000);
  });

  window.addEventListener('pageshow', function (ev) { if (ev.persisted) { resetear(); } });

  pintar();

  var root = document.documentElement;
  var metaTema = document.querySelector('meta[name="theme-color"]');
  function aplicarTema(t) {
    root.setAttribute('data-theme', t);
    if (metaTema) { metaTema.setAttribute('content', t === 'light' ? '#F4F1E9' : '#14120F'); }
  }

  var saved = null;
  try { saved = localStorage.getItem('cosac-tema'); } catch (e) {}
  if (saved === 'light' || saved === 'dark') {
    aplicarTema(saved);
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
    aplicarTema('light');
  }

  document.getElementById('themeBtn').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    aplicarTema(next);
    try { localStorage.setItem('cosac-tema', next); } catch (e) {}
  });
})();
</script>
</body>
</html>
